apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: pbl-tcp-connect
  namespace: pbl-security
spec:
  options:
    - name: policy-mode
      value: monitor
  kprobes:
    - call: tcp_connect
      syscall: false
      message: PBL TCP connect attribution
      args:
        - index: 0
          type: sock
